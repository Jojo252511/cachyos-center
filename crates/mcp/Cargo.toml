[package]
name = "cachyos-center-mcp"
description = "Local, read-only MCP server of cachyos-center (stdio transport)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "cachyos-center-mcp"
path = "src/main.rs"

# Deliberately no zbus and no helper crate: the MCP server cannot reach the
# privileged helper. Only the read service (`ReadApi`) is used.
[dependencies]
anyhow.workspace = true
cachyos-center-core.workspace = true
cachyos-center-service.workspace = true
clap.workspace = true
# Server side only: stdio transport, no HTTP, no network listener.
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The tests act as an MCP host (client + child process transport).
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true

[lints]
workspace = true
