[package]
name = "cachyos-center-desktop"
description = "Desktop application of cachyos-center (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "cachyos-center"

[[bin]]
name = "cachyos-center"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
cachyos-center-core.workspace = true
cachyos-center-packages.workspace = true
cachyos-center-service.workspace = true
cachyos-center-system.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.0", features = [] }
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[features]
# Set by the Tauri CLI for production builds (serves the bundled frontend).
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
