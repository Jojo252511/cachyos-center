# cargo-deny configuration: security advisories, licenses and sources.
# The project is GPL-3.0-or-later (the libalpm bindings are GPL-3.0);
# every allowed license is compatible with it.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, compile-time only: pulled in by gtk3-macros of Tauri's
    # Linux stack (gtk-rs 0.18). No runtime code of it ends up in the binaries.
    { id = "RUSTSEC-2024-0370", reason = "transitive proc-macro of gtk-rs 0.18 (Tauri Linux stack)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The libalpm bindings declare the deprecated SPDX id "GPL-3.0" (= GPL-3.0-only).
[[licenses.clarify]]
crate = "alpm"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "alpm-sys"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "pacmanconf"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "cini"
expression = "GPL-3.0-only"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
