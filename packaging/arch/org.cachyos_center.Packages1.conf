<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  cachyos-center privileged helper.
  Only root may own the name. Everybody may call the interface; every
  changing method is authorized per call with polkit
  (org.cachyos-center.* actions), read methods expose no secrets.
-->
<busconfig>
  <policy user="root">
    <allow own="org.cachyos_center.Packages1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.cachyos_center.Packages1"
           send_interface="org.cachyos_center.Packages1"/>
    <allow send_destination="org.cachyos_center.Packages1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.cachyos_center.Packages1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.cachyos_center.Packages1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
